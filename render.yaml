services:
  - type: web
    name: pharmacy-operations
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-operations-db
          property: connectionString
      - key: BUSINESS_TIMEZONE
        value: Africa/Cairo
      - key: COOKIE_SECURE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAT_MODEL_ID
        value: gemini-3.8-flash
      - key: CHAT_MAX_OUTPUT_TOKENS
        value: "1800"
      - key: FORWARDED_ALLOW_IPS
        value: "*"

databases:
  - name: pharmacy-operations-db
    plan: 0.5c-1g
    region: frankfurt
    postgresMajorVersion: "18"
