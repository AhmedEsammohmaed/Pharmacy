services:
  - type: web
    name: pharmacy-operations
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BUSINESS_TIMEZONE
        value: Africa/Cairo
      - key: COOKIE_SECURE
        value: "true"
      - key: CHAT_PROVIDER
        value: gemini
      - key: CHAT_MODEL_ID
        value: gemini-3.8-flash
      - key: CHAT_MAX_OUTPUT_TOKENS
        value: "1800"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
