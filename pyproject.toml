[project]
name = "pharmacy-operations-cloudflare"
version = "0.1.0"
description = "Pharmacy Operations FastAPI app on Cloudflare Python Workers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.142.2",
    "SQLAlchemy==2.1.3",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "pg8000>=1.31,<2",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
